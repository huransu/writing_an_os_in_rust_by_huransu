[package]
name = "blog_os"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "blog_os"
test = true
bench = false

[profile.release]
panic = "abort"

[dependencies]
bootloader = "0.9.0"
spin = "0.5.2"
uart_16550 = "0.6.0"
volatile = "0.2.6"
x86_64 = "0.14.2"

[dependencies.lazy_static]
version = "1.0.0"
features = ["spin_no_std"]

[package.metadata.bootimage]
run-args = ["-nographic"]
test-args = ["-device", "isa-debug-exit,iobase=0xf4,iosize=0x04", "-nographic"]
test-success-exit-code = 33
test-timeout = 120
